<VirtualHost *:80>
    ServerName 10.15.20.150
    ServerAlias 10.143.22.240

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog ${APACHE_LOG_DIR}/mado-error.log
    CustomLog ${APACHE_LOG_DIR}/mado-access.log combined
</VirtualHost>
