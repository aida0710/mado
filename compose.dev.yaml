# compose.dev.yaml
# project name と container_name を mado-dev-* で揃える。compose.prod.yaml は
# mado-prod-* なので、両者は完全に独立した名前空間で走る (network/volume も自動で
# project name prefix される)。dev → prod のうっかり乗り換えで残留コンテナと
# 衝突する事故を防ぐため。
name: mado-dev
services:
  postgres:
    image: postgres:16-alpine
    container_name: mado-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # dev はゼロ設定で動くよう既定値あり。.env で上書き可能。
      # 注意: いずれも DB ボリュームの初回 init 時のみ反映 (既存DBは ALTER ROLE)。
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: dashboard
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-CHANGEME}"
      LINEAGE_DB_PASSWORD: "${LINEAGE_DB_PASSWORD:-lineage-dev-only}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    # 初回 init 中の一時サーバは Unix socket だけを listen する。socket 経由の pg_isready は
    # migration 適用前に healthy を返すため、init 完了後に立つ本サーバだけが応える TCP で確認する。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-internal:
    build:
      context: ./api
      target: development
    container_name: mado-dev-api-internal
    command: ["npx", "tsx", "watch", "internal.ts"]
    env_file:
      - .env
    environment:
      PORT: 3000
    volumes:
      - ./api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  api-lineage:
    build:
      context: ./api
      target: development
    container_name: mado-dev-api-lineage
    command: ["npx", "tsx", "watch", "lineage.ts"]
    environment:
      LINEAGE_API_PORT: 3001
      DATABASE_URL_RW: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:-lineage-dev-only}@postgres:5432/dashboard"
      DATABASE_URL_RO: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:-lineage-dev-only}@postgres:5432/dashboard"
      DATASET_REGISTRY_URL: "${DATASET_REGISTRY_URL:-http://host.docker.internal:8088}"
      DATASET_REGISTRY_TOKEN: "${DATASET_REGISTRY_TOKEN:-development-token-change-me}"
      OPENLINEAGE_BODY_LIMIT_BYTES: "${OPENLINEAGE_BODY_LIMIT_BYTES:-2097152}"
    volumes:
      - ./api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  media-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
      target: development
    container_name: mado-dev-media-worker
    command: ["npx", "tsx", "watch", "worker.ts"]
    env_file:
      - .env
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  front:
    build: ./front
    container_name: mado-dev-front
    # About のコミット表示。通常は下の .git マウント + コンテナ内 git で解決される。
    # env が設定されていれば (例: ./dev.sh) そちらを優先 (vite.config が env→git→'dev')。
    environment:
      VITE_GIT_COMMIT: "${VITE_GIT_COMMIT:-}"
      VITE_GIT_DATE: "${VITE_GIT_DATE:-}"
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
      # vite.config がコミット情報を読むため host の .git を read-only で渡す。
      - ./.git:/app/.git:ro
    depends_on:
      - api-internal
      - api-lineage

volumes:
  db_data:
