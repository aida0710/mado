# mdx deployment: Mado and its private lineage backends share one Compose
# project and one bridge network. Mado nginx listeners are published on loopback;
# The Compose-managed edge nginx terminates TLS for the intranet UI. A future
# public API hostname must remain separate and proxy only the OpenLineage listener.
name: mado-mdx

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}"
      POSTGRES_DB: dashboard
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?.env に DASHBOARD_PASSWORD を設定してください}"
      LINEAGE_DB_PASSWORD: "${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}"
    volumes:
      - mado-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  registry-db:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: "${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD is required}"
    volumes:
      - registry-db-data:/var/lib/postgresql/data
      - ./dataset-registry/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./dataset-registry/db/migrations/002_openlineage_ingest.sql:/docker-entrypoint-initdb.d/002-openlineage-ingest.sql:ro
      - ./dataset-registry/db/migrations/003_catalog_discovery.sql:/docker-entrypoint-initdb.d/003-catalog-discovery.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 5s
      timeout: 3s
      retries: 20

  marquez-db:
    image: postgres:14.18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: "${MARQUEZ_DB_PASSWORD:?MARQUEZ_DB_PASSWORD is required}"
    volumes:
      - marquez-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 5s
      timeout: 3s
      retries: 20

  marquez-api:
    image: marquezproject/marquez:0.50.0
    restart: unless-stopped
    environment:
      MARQUEZ_CONFIG: /usr/src/app/marquez.registry.yml
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: "${MARQUEZ_DB_PASSWORD:?MARQUEZ_DB_PASSWORD is required}"
    volumes:
      - ./dataset-registry/marquez.yml:/usr/src/app/marquez.registry.yml:ro
    depends_on:
      marquez-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5001'"]
      interval: 10s
      timeout: 5s
      retries: 20

  registry-api:
    build: ./dataset-registry
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://registry:${REGISTRY_DB_PASSWORD}@registry-db:5432/registry"
      MARQUEZ_URL: http://marquez-api:5000
      REGISTRY_INGEST_TOKEN: "${REGISTRY_INGEST_TOKEN:?REGISTRY_INGEST_TOKEN is required}"
    depends_on:
      registry-db:
        condition: service_healthy
      marquez-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  lineage-worker:
    build: ./dataset-registry
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://registry:${REGISTRY_DB_PASSWORD}@registry-db:5432/registry"
      MARQUEZ_URL: http://marquez-api:5000
    depends_on:
      registry-db:
        condition: service_healthy
      marquez-api:
        condition: service_healthy

  api-internal:
    build:
      context: ./api
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    command: ["node", "dist/internal.js"]
    env_file:
      - .env
    environment:
      MADO_ENV: production
      PORT: "3000"
      DATASET_REGISTRY_URL: http://registry-api:8080
      DATASET_REGISTRY_TOKEN: "${REGISTRY_INGEST_TOKEN:?REGISTRY_INGEST_TOKEN is required}"
      MARQUEZ_URL: http://marquez-api:5000
    depends_on:
      postgres:
        condition: service_healthy
      registry-api:
        condition: service_healthy
      marquez-api:
        condition: service_healthy
    restart: unless-stopped

  api-lineage:
    build:
      context: ./api
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    command: ["node", "dist/lineage.js"]
    environment:
      LINEAGE_API_PORT: "3001"
      DATABASE_URL_RW: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      DATABASE_URL_RO: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      DATASET_REGISTRY_URL: http://registry-api:8080
      DATASET_REGISTRY_TOKEN: "${REGISTRY_INGEST_TOKEN:?REGISTRY_INGEST_TOKEN is required}"
      OPENLINEAGE_BODY_LIMIT_BYTES: "${OPENLINEAGE_BODY_LIMIT_BYTES:-2097152}"
    depends_on:
      postgres:
        condition: service_healthy
      registry-api:
        condition: service_healthy
    restart: unless-stopped

  media-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      MADO_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VITE_GIT_COMMIT: "${VITE_GIT_COMMIT:-}"
        VITE_GIT_DATE: "${VITE_GIT_DATE:-}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      - api-internal
      - api-lineage
    restart: unless-stopped

  edge:
    image: nginxinc/nginx-unprivileged:alpine@sha256:901e944d1f4fc2bd077e8f5568b98c1f6f8cdacf6b97a87747c43134a339b9a7
    user: "0:0"
    network_mode: host
    environment:
      MADO_HOSTNAME: "${MADO_HOSTNAME:-mado.internal.dubguild.com}"
      MADO_API_HOSTNAME: "${MADO_API_HOSTNAME:-mado-api.internal.dubguild.com}"
      NGINX_ENVSUBST_FILTER: "^MADO_"
    volumes:
      - ./nginx/edge-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/edge.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=0755
      - /tmp:size=32m,mode=1777
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  mado-db-data:
  registry-db-data:
  marquez-db-data:
