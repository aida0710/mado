name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify version, notes, workflow, and bundle
        run: |
          scripts/release/verify-contract.sh
          mkdir -p dist/release-manifests
          digest="sha256:$(printf '%064d' 0)"
          printf 'ref=ghcr.io/aida0710/mado-api@%s\n' "$digest" > dist/release-manifests/api.env
          printf 'ref=ghcr.io/aida0710/mado-media-worker@%s\n' "$digest" > dist/release-manifests/worker.env
          printf 'ref=ghcr.io/aida0710/mado-web@%s\n' "$digest" > dist/release-manifests/web.env
          scripts/release/build-bundle.sh "v$(cat VERSION)" dist/release dist/release-manifests
      - name: Validate generated release Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          DASHBOARD_PASSWORD: ci-dashboard-password
          LINEAGE_DB_PASSWORD: ci-lineage-password
          DATASET_REGISTRY_URL: http://registry.invalid
          DATASET_REGISTRY_TOKEN: ci-registry-token-not-a-secret
        run: |
          archive="dist/release/mado-v$(cat VERSION).tar.gz"
          mkdir -p /tmp/mado-release-contract
          tar -xzf "$archive" -C /tmp/mado-release-contract
          bundle="/tmp/mado-release-contract/mado-v$(cat VERSION)"
          cp "$bundle/.env.example" "$bundle/.env"
          docker compose -f "$bundle/compose.yaml" config --quiet

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Start the schema-complete test database
        run: |
          cp .env.example .env
          docker compose -f compose.dev.yaml up -d postgres
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' mado-dev-postgres)" = healthy ] && exit 0
            sleep 1
          done
          docker compose -f compose.dev.yaml logs postgres
          exit 1
      - name: Lint, test, and build
        working-directory: api
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev
      - name: Stop test database
        if: always()
        run: docker compose -f compose.dev.yaml down -v

  front:
    name: Front
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
        working-directory: front
      - name: Lint, test, and build
        working-directory: front
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev

  images:
    name: Image (${{ matrix.id }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api
            context: api
            file: api/Dockerfile
          - id: worker
            context: api
            file: api/Dockerfile.worker
          - id: web
            context: .
            file: nginx/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build compiled release image
        run: |
          version=$(cat VERSION)
          commit=$(git rev-parse HEAD)
          build_date=$(git log -1 --format=%cI)
          docker build --target release \
            --build-arg MADO_VERSION="$version" \
            --build-arg VCS_REF="$commit" \
            --build-arg BUILD_DATE="$build_date" \
            --build-arg VITE_GIT_COMMIT="$commit" \
            --build-arg VITE_GIT_DATE="$build_date" \
            -f "${{ matrix.file }}" -t "mado-ci-${{ matrix.id }}:$commit" "${{ matrix.context }}"
      - name: Smoke compiled image
        run: |
          image="mado-ci-${{ matrix.id }}:$(git rev-parse HEAD)"
          case "${{ matrix.id }}" in
            api)
              docker run --rm "$image" node -e \
                'const p=require("./package.json"); if(p.version!==process.argv[1]) process.exit(1)' \
                "$(cat VERSION)"
              ;;
            worker)
              docker run --rm "$image" ffmpeg -version >/dev/null
              ;;
            web)
              docker run --rm --add-host api-internal:127.0.0.1 --add-host api-lineage:127.0.0.1 \
                "$image" nginx -t
              ;;
          esac
