version: 2
updates:
  - package-ecosystem: npm
    directories: [/api, /front, /pages]
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    # Reactと残りの更新をまとめ、通常のnpm更新PRは同時に2件までにする。
    open-pull-requests-limit: 2
    groups:
      react:
        patterns: [react, react-dom, react-is, "@types/react", "@types/react-dom"]
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScriptのメジャー更新はtypescript-eslintの対応後に行う。
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node.js 22の構成に型定義のメジャー更新だけを混ぜない。
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directories: [/api, /nginx]
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    open-pull-requests-limit: 1
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Node.jsのLTS移行はCI・全イメージ・開発手順をそろえて行う。
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
