# nginx/default.conf
#
# :8080のWeb UIはLAN / VPN内利用、:8081はOpenLineage ingest専用
# (詳細はREADMEの「セキュリティ」)。どちらもhost loopbackへだけpublishし、
# intranet proxyと外部TLS proxyを混在させない。
log_format mado_no_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

# Internet向けOpenLineage入口のresource保護。入口自体はhostのTLS proxyだけが
# loopback経由で利用し、ここではproxyが渡す実client IPと入口全体の双方を制限する。
limit_req_zone $binary_remote_addr zone=lineage_per_ip:10m rate=10r/s;
limit_req_zone $server_addr zone=lineage_global:1m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=lineage_conn_per_ip:10m;
limit_conn_zone $server_addr zone=lineage_conn_global:1m;

# TLS edgeから渡されたhttpsだけを採用し、それ以外は実接続schemeへ倒す。
# production listenerはhost loopbackだけなので、外部clientはこのheaderを注入できない。
map $http_x_forwarded_proto $mado_forwarded_proto {
    default $scheme;
    "https" "https";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # nginx version を Server ヘッダ / エラーページで露出させない
    server_tokens off;
    access_log /var/log/nginx/access.log mado_no_query;

    # Host TLS edgeが上書きした実client addressだけを採用する。
    # recursiveを無効にし、clientが先頭へ注入した偽IPを辿らない。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # セキュリティヘッダ (LAN 内ツール、HTTPS なしのため HSTS は付けない)。
    # nginx の `add_header` は child location が独自の `add_header` を 1 つでも
    # 宣言すると親側のヘッダが継承されないため、各 location でも再宣言が必要。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ── Vite ビルドのハッシュ付き静的アセット (/assets/index-XXXX.js 等) ─────
    # ハッシュは内容の指紋。中身が変われば URL も変わるので「同じ URL = 同じ中身」
    # が永久に成り立つ。`immutable` でブラウザに「以後 revalidate も不要」と伝える。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # ── index.html: 古い HTML が新しい chunk ハッシュに追いつかないと
    #    「Failed to fetch dynamically imported module」(stale HTML 問題) が出る。
    #    `no-cache` で毎リクエスト再検証する (ETag/Last-Modified ベースで 304 が
    #    返るので軽量)。デプロイ直後でも次のページロードで新 HTML を取れる。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # SPA: client-side ルーティング有効。/storage/... など実ファイルが無い path も
    # index.html にフォールバックして React Router が引き継ぐ。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ブラウザ向け internal API。
    location /api/internal/ {
        proxy_pass http://api-internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Login / OIDC callback。session cookieはapi-internalが発行する。
    location /api/auth/ {
        proxy_pass http://api-internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $mado_forwarded_proto;
        proxy_buffering off;
    }

    # Pipeline専用。browser sessionではなくService Account Bearer keyを要求する。
    location /api/openlineage/ {
        proxy_pass http://api-lineage:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $mado_forwarded_proto;
        client_max_body_size 2m;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
}

# Pipeline専用の外部公開入口。host側では127.0.0.1だけにpublishし、将来の
# TLS reverse proxyからのみ接続する。UI・browser auth・internal API・healthは
# このlistenerへ一切載せない。
server {
    listen 8081;
    server_name _;

    server_tokens off;
    # unprivileged imageのstdout symlinkを使い、query stringを含めない。
    access_log /var/log/nginx/access.log mado_no_query;
    add_header Cache-Control "no-store" always;

    # host TLS proxyがX-Forwarded-Forの末尾へ追加した実client addressだけを採用する。
    # client入力のXFFやrequest IDはupstreamへ引き継がない。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;

    location = /api/openlineage/v1/lineage {
        # OpenLineage ingest以外のmethodを公開面へ増やさない。
        if ($request_method != POST) {
            return 404;
        }

        limit_req zone=lineage_per_ip burst=50 nodelay;
        limit_req zone=lineage_global burst=200 nodelay;
        limit_conn lineage_conn_per_ip 20;
        limit_conn lineage_conn_global 200;

        proxy_pass http://api-lineage:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $mado_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
