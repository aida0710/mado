# compose.prod.yaml
# project name と container_name を mado-prod-* で揃える。compose.dev.yaml は
# mado-dev-* なので、両者は完全に独立した名前空間で走る (network/volume も自動で
# project name prefix される)。dev → prod のうっかり乗り換えで残留コンテナと
# 衝突する事故を防ぐため。
#
# volume は明示名を付けず Docker の `${project}_${name}` 自動命名に任せる
# (= mado-prod_db_data)。dev も mado-dev_db_data なので並ぶ。
name: mado-prod
services:
  postgres:
    image: postgres:16-alpine
    container_name: mado-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # 本番は弱い既定値を埋め込まず、.env からの注入を必須にする (未設定なら起動失敗)。
      # 注意: いずれも DB ボリュームの初回 init 時のみ反映。既存DBは ALTER ROLE で変更する。
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}"
      POSTGRES_DB: dashboard
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:?.env に DASHBOARD_PASSWORD を設定してください (DATABASE_URL のパスワードと一致させること)}"
      LINEAGE_DB_PASSWORD: "${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    # 初回 init 中の一時サーバは Unix socket だけを listen する。socket 経由の pg_isready は
    # migration 適用前に healthy を返すため、init 完了後に立つ本サーバだけが応える TCP で確認する。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-internal:
    build:
      context: ./api
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    container_name: mado-prod-api-internal
    command: ["node", "dist/internal.js"]
    env_file:
      - .env
    environment:
      MADO_ENV: production
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-lineage:
    build:
      context: ./api
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    container_name: mado-prod-api-lineage
    command: ["node", "dist/lineage.js"]
    environment:
      LINEAGE_API_PORT: 3001
      DATABASE_URL_RW: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      DATABASE_URL_RO: "postgres://mado_lineage:${LINEAGE_DB_PASSWORD:?.env に LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      DATASET_REGISTRY_URL: "${DATASET_REGISTRY_URL:?.env に DATASET_REGISTRY_URL を設定してください}"
      DATASET_REGISTRY_TOKEN: "${DATASET_REGISTRY_TOKEN:?.env に DATASET_REGISTRY_TOKEN を設定してください}"
      OPENLINEAGE_BODY_LIMIT_BYTES: "${OPENLINEAGE_BODY_LIMIT_BYTES:-2097152}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  media-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
      target: release
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    container_name: mado-prod-media-worker
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      MADO_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      # About 表示用のコミット情報を front ビルドへ渡す (deploy.sh が export する)。
      args:
        MADO_VERSION: "${MADO_VERSION:-dev}"
        VITE_GIT_COMMIT: "${VITE_GIT_COMMIT:-}"
        VITE_GIT_DATE: "${VITE_GIT_DATE:-}"
        VCS_REF: "${VITE_GIT_COMMIT:-}"
        BUILD_DATE: "${VITE_GIT_DATE:-}"
    container_name: mado-prod-nginx
    # nginx は非 root user (uid 101) で動くため container 内では :8080 を listen する。
    # UIもloopbackだけにbindし、host側intranet proxyからのみ公開する。
    ports:
      - "127.0.0.1:8080:8080"
      # 外部OpenLineage入口はhost TLS proxyからだけ到達可能にする。
      - "127.0.0.1:8081:8081"
    depends_on:
      - api-internal
      - api-lineage
    restart: unless-stopped

volumes:
  db_data:
